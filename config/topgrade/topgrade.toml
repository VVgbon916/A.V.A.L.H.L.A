# ── Topgrade config for VVgbon@VVgBazz ──

[misc]
disable = [
    "system",         # handled separately by ujust on Bazzite
    "flatpak",        # included in the ujust update
    "waydroid",
    "cursor_agent",
    "antigravity",
    "containers",
    "ollama",         # replaced by the custom command below
]

ignore_failures = [
    "waydroid",
    "cursor_agent",
    "antigravity",
    "containers",
]

[commands]
"Update my Ollama models" = "ollama pull qwen2.5-coder:7b"
